spring.application.name=Fitness_Tracker

# DB config now reads from env vars in production, falls back to local defaults for dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_tracker_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:141220}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port - most hosts (Render, Railway) inject PORT at runtime
server.port=${PORT:8080}

# JWT configuration
# In production, set JWT_SECRET as an env var on your host - never commit the real value to git
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomBase64SecretOfAtLeast32BytesForHS256Signing}
jwt.expiration=86400000

# CORS - set this to your deployed frontend's URL in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
